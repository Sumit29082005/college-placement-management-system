<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar"><h1>🛠️ Placement Cell Admin</h1><div><span id="who"></span> <button onclick="logout()">Logout</button></div></header>
<main class="container">
  <nav class="tabs">
    <button class="active" data-tab="overview">Overview</button>
    <button data-tab="students">Students</button>
    <button data-tab="companies">Companies</button>
    <button data-tab="drives">Drives</button>
    <button data-tab="applications">Applications</button>
  </nav>

  <section id="tab-overview" class="tab">
    <div class="grid" id="stats"></div>
    <div class="card" style="margin-top:1rem"><h2>Department-wise placement</h2><div id="deptBars"></div></div>
  </section>

  <section id="tab-students" class="tab hidden">
    <div class="card table-wrap">
      <table><thead><tr><th>Roll</th><th>Name</th><th>Dept</th><th>CGPA</th><th>Backlogs</th><th>Year</th><th>Email</th><th>Placed</th><th></th></tr></thead>
      <tbody id="studentsBody"></tbody></table>
    </div>
  </section>

  <section id="tab-companies" class="tab hidden">
    <form class="card" id="companyForm">
      <h2>Add company</h2>
      <div class="form-grid">
        <div><label>Name</label><input name="name" required></div>
        <div><label>Industry</label><input name="industry"></div>
        <div><label>Website</label><input name="website" type="url"></div>
        <div><label>Location</label><input name="location"></div>
      </div>
      <label>Description</label><textarea name="description" rows="2"></textarea>
      <button class="btn" type="submit">Add company</button>
    </form>
    <div class="card table-wrap">
      <table><thead><tr><th>Name</th><th>Industry</th><th>Location</th><th>Website</th><th></th></tr></thead>
      <tbody id="companiesBody"></tbody></table>
    </div>
  </section>

  <section id="tab-drives" class="tab hidden">
    <form class="card" id="driveForm">
      <h2>Create placement drive</h2>
      <div class="form-grid">
        <div><label>Company</label><select name="company_id" id="driveCompany" required></select></div>
        <div><label>Job title</label><input name="job_title" required></div>
        <div><label>Package (LPA)</label><input type="number" step="0.1" min="0" name="package_lpa" required></div>
        <div><label>Location</label><input name="location"></div>
        <div><label>Min CGPA</label><input type="number" step="0.1" min="0" max="10" name="min_cgpa" value="6"></div>
        <div><label>Max backlogs</label><input type="number" min="0" name="max_backlogs" value="0"></div>
        <div><label>Allowed departments (comma separated or ALL)</label><input name="allowed_departments" value="ALL"></div>
        <div><label>Application deadline</label><input type="date" name="deadline" required></div>
        <div><label>Drive date</label><input type="date" name="drive_date" required></div>
      </div>
      <label>Description</label><textarea name="description" rows="2"></textarea>
      <button class="btn" type="submit">Create drive</button>
    </form>
    <div class="card table-wrap">
      <table><thead><tr><th>Company</th><th>Role</th><th>LPA</th><th>Eligibility</th><th>Deadline</th><th>Applicants</th><th>Status</th><th></th></tr></thead>
      <tbody id="drivesBody"></tbody></table>
    </div>
  </section>

  <section id="tab-applications" class="tab hidden">
    <div class="card row">
      <div style="min-width:240px"><label>Filter by drive</label><select id="appDrive"><option value="">All drives</option></select></div>
      <button class="btn ghost" id="exportBtn">⬇ Export CSV</button>
    </div>
    <div class="card table-wrap">
      <table><thead><tr><th>Student</th><th>Roll</th><th>Dept</th><th>CGPA</th><th>Company</th><th>Role</th><th>Applied</th><th>Status</th></tr></thead>
      <tbody id="appsBody"></tbody></table>
    </div>
  </section>
</main>
<script src="assets/js/common.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
